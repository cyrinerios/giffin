<style>
/*
VOICE: calm, quick, office tool.
IDEA: the company's job-file desk: a sign-in card, then an in-tray of declarations.
PICTURE: the in-tray list itself, one row per declaration with its status and actions.
COLOUR and TYPE: brand brush blue #046cb4, white sheets, navy ink, green for submit; Figtree.
LAYOUT: login card on a blue ground; dashboards as a single column up to 1240px; stacks on phones.
*/
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0a1622);--ink:light-dark(#0c1f33,#e6eef6);--mute:light-dark(#546579,#93a6ba);
--line:light-dark(#d9e3ee,#24364a);--field:light-dark(#f3f7fb,#122233);--blue:light-dark(#046cb4,#4aa3e8);--brand:#046cb4;--head:light-dark(#e7f1fa,#10304d);--red:light-dark(#d4211a,#ff6b63);
--green:light-dark(#0a7d4f,#3cc48a);--amber:light-dark(#a35f00,#f0b44a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;font:16px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:clip}
[hidden]{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:clamp(16px,4vw,48px);background:radial-gradient(120% 90% at 15% 0%,#1a8ad8 0%,var(--brand) 45%,#03508a 100%)}
.card{width:min(560px,100%);background:var(--bg);border-radius:18px;padding:clamp(22px,4vw,40px);box-shadow:0 24px 60px rgb(2 30 60/.35)}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.logo{height:64px;width:auto;flex:none}.logo.sm{height:52px}
h1{font-size:clamp(28px,5vw,36px);line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--mute)}
fieldset{border:0;margin:0 0 20px;padding:0}
legend,label.l{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:8px;padding:0}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{width:min(520px,100%)}
.rhint{margin:6px 0 0;font-size:13px;color:var(--mute);min-height:1em}
@media(max-width:640px){.roles{grid-template-columns:1fr}.role span{min-height:0;flex-direction:row;align-items:center}.role small{display:none}}
.role{position:relative}
.role input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.role span{display:flex;flex-direction:column;gap:10px;min-height:128px;padding:16px;border:2px solid var(--line);border-radius:14px;background:var(--field);cursor:pointer;transition:border-color .15s,background .15s}
.role svg{width:34px;height:34px;color:var(--blue)}
.role b{font-size:17px;font-weight:800}
.role small{color:var(--mute);font-size:13px;line-height:1.35}
.role input:checked+span{border-color:var(--brand);background:var(--head)}
.role input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.who{margin-bottom:20px}
input[type=password]{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 64px 9px 11px;width:100%;min-height:46px}
.pwrap{position:relative}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--blue);min-height:40px;padding:0 10px;cursor:pointer}
.go:disabled{opacity:.7;cursor:wait}
select,input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-height:46px}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.go{font:inherit;font-weight:700;font-size:17px;width:100%;min-height:50px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
.go:hover{filter:brightness(1.08)}
.err{min-height:22px;color:var(--red);font-weight:600;font-size:14px;margin:10px 0 0}
.note{font-size:13px;color:var(--mute);margin:14px 0 0}

/* ---------- dashboards ---------- */
#dash{min-height:100vh}
.top{background:var(--bg);border-bottom:3px solid var(--brand)}
.top .in,.wrap{max-width:1240px;margin:0 auto;padding-inline:max(4vw,16px)}
.top .in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:18px}
.top h1{font-size:clamp(24px,3.4vw,34px)}
.top .who2{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.top .who2 b{color:var(--blue)}
.wrap{padding-block:clamp(20px,3vw,36px)}
.btn{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{filter:brightness(1.08)}
.btn.g{background:#0a7d4f;border-color:#0a7d4f;color:#fff}
.btn.sm{min-height:40px;padding:0 13px;font-size:14px}
.btn.link{border:0;background:none;color:var(--blue);padding:0 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:24px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .n{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .t{font-size:13px;font-weight:600;color:var(--mute)}
.stat.s1 .n{color:var(--blue)}.stat.s2 .n{color:var(--amber)}.stat.s3 .n{color:var(--green)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:20px;margin:0 auto 0 0}
.bar select{width:auto;min-width:220px}
.group{margin-bottom:22px}
.group h3{font-size:16px;margin:0 0 8px;color:var(--blue)}
.tray{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) auto auto;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .no{font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row .jobs{font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.row .when{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.row .acts{display:flex;gap:8px;justify-self:end}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.sub{background:var(--head);color:var(--blue)}
.chip.ip{background:light-dark(#fff3dc,#3a2a0c);color:var(--amber)}
.chip.done{background:light-dark(#e3f5ec,#0f3324);color:var(--green)}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
@media(max-width:760px){
 .row{grid-template-columns:1fr auto;gap:6px 12px}
 .row .jobs,.row .when{grid-column:1}
 .row .chip{grid-column:2;grid-row:1;justify-self:end}
 .row .acts{grid-column:1/-1;justify-self:stretch}.row .acts .btn{flex:1}
 .bar select{width:100%}
}

/* ---------- viewer ---------- */
#viewer{position:fixed;inset:0;z-index:8;background:rgb(4 20 40/.55);display:grid;place-items:start center;overflow:auto;padding:clamp(10px,3vw,40px)}
.sheet{width:min(1000px,100%);background:var(--bg);border-radius:14px;box-shadow:0 24px 60px rgb(0 0 0/.3)}
.sheet .sh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 22px;border-bottom:3px solid var(--brand)}
.sheet .sh h2{margin:0;font-size:22px}
.sheet .sh .x{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px 18px;padding:16px 22px}
.meta div{font-size:13px;color:var(--mute);font-weight:600}.meta div b{display:block;color:var(--ink);font-size:16px}
.vt{width:100%;border-collapse:collapse;font-size:15px}
.vt th{font-size:13px;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink)}
.vt td{padding:8px 10px;border-bottom:1px solid var(--line)}
.vt .n{text-align:right;font-variant-numeric:tabular-nums}
.vt tr.j td{background:var(--brand);color:#fff;font-weight:800}
.vt tr.s td{background:var(--head);color:var(--blue);font-weight:700}
.vt tr.none td{color:var(--mute);font-style:italic}
.vwrap{padding:0 22px 22px;overflow-x:auto}

.track{margin:0 22px 14px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:light-dark(#f3faf6,#0f2a1f)}
.track b{color:var(--green)}
.track ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.track li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;padding-left:16px;position:relative}
.track li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--green)}
.track time{color:var(--mute);font-variant-numeric:tabular-nums}
.vt td.bb{font-weight:700}.vt.snap td{white-space:nowrap;font-size:13px;padding:6px 8px}.vt.snap td:nth-child(2),.vt.snap td:nth-child(3){white-space:normal;min-width:150px}
.row .tot{font-weight:800;color:var(--ink);font-size:15px}
.vt tr.rv td{border-bottom:0;padding-top:12px}
.vt tr.what td{padding-top:0;padding-bottom:14px}
.wl{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:4px}

.stat.s4 .n{color:#7a3fb5}.stat .u{font-size:12px;color:var(--mute);margin-top:2px}
.stats{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.chip.ret{background:light-dark(#fde8e7,#3a1210);color:var(--red)}

d:var(--bg)}\n.rate.in .rl{margin:0 0 4px}\n.rate .pct{position:relative}.rate .pct input{padding-right:30px;font-weight:700;font-size:18px;text-align:right}\n.rate .pct input::-webkit-inner-spin-button,.rate .pct input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.rate .pct input{-moz-appearance:textfield;padding-left:8px}\n.rate .pct span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mute);font-weight:600;pointer-events:none}\n.rate.in.miss input{border-color:var(--red)}\n.total.wait .big{font-size:clamp(22px,3vw,30px);opacity:.9}\n.warn{color:var(--red);font-weight:600}\n.factor{margin:12px 0 0;font-size:14px;color:var(--mute)}\n.total{background:var(--brand);color:#fff;border:0;display:flex;flex-direction:column;justify-content:space-between}\n.total .lbl{font-weight:600;font-size:14px}\n.total .big{font-size:clamp(34px,5vw,52px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}\n.total dl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:10px 0 0;font-size:14px}\n.total dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}\ntable{width:100%;border-collapse:collapse;font-size:15px}\nth{font-size:13px;font-weight:600;color:var(--mute);text-align:left;padding:8px 6px;border-bottom:2px solid var(--ink);white-space:nowrap}\nth.n,td.n{text-align:right}\ntd{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}\ntd input{min-height:40px;padding:7px 9px}\ntd.num{width:44px;color:var(--mute);font-variant-numeric:tabular-nums}\ntd.out{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-weight:500}\ntd.out.g{font-weight:700}\n.w-price{width:100px}.w-sm{width:78px}.w-basis{width:170px}\ntd.ro{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}td.ro.n{text-align:right}\ntr.head td{background:var(--head);padding:10px 8px}\ntr.head .sh{display:flex;align-items:center;justify-content:space-betwee r\" required><span>%<\/span><\/div><\/div>\n          <div class=\"rate in\"><label class=\"rl\" for=\"mk\">Markup<\/label><div class=\"pct\"><input id=\"mk\" type=\"number\" step=\"any\" min=\"0\" inputmode=\"decimal\" placeholder=\"Enter\" required><span>%<\/span><\/div><\/div>\n          <div class=\"rate in\"><label class=\"rl\" for=\"cont\">Contingency<\/label><div class=\"pct\"><input id=\"cont\" type=\"number\" step=\"any\" min=\"0\" inputmode=\"decimal\" placeholder=\"Enter\" required><span>%<\/span><\/div><\/div>\n          <div class=\"rate in\"><label class=\"rl\" for=\"nego\">Negotiation<\/label><div class=\"pct\"><input id=\"nego\" type=\"number\" step=\"any\" min=\"0\" inputmode=\"decimal\" placeholder=\"Enter\" required><span>%<\/span><\/div><\/div>\n          <div class=\"rate\"><span class=\"rl\">Consumables<\/span><span class=\"rv\">5%<\/span><span class=\"rt\">Fixed<\/span><\/div>\n        <\/div>\n        <p class=\"factor\" id=\"factor\"><\/p>\n        <p class=\"factor warn\" id=\"warn\" hidden><\/p>\n      <\/div>\n      <div class=\"card total\" id=\"grandBox\" aria-live=\"polite\">\n        <div><div class=\"lbl\">Grand total<\/div><div class=\"big\" id=\"grand\">0<\/div><\/div>\n        <dl>\n          <dt>Total cost (before markups)<\/dt><dd id=\"sCost\">0<\/dd>\n          <dt>Overhead<\/dt><dd id=\"sOh\">0<\/dd>\n          <dt>Markup<\/dt><dd id=\"sMark\">0<\/dd>\n          <dt>Contingency<\/dt><dd id=\"sCont\">0<\/dd>\n          <dt>Negotiation<\/dt><dd id=\"sNego\">0<\/dd>\n        <\/dl>\n      <\/div>\n    <\/div>\n\n    <table id=\"t\">\n      <thead><tr>\n        <th>#<\/th><th>Description<\/th><th>Basis / UOM<\/th><th class=\"n\">Unit price<\/th><th class=\"n\">Hrs<\/th><th class=\"n\">Qty<\/th><th class=\"n\">Days<\/th><th class=\"n\">Total cost<\/th><th class=\"n\">Total<\/th><th><span style=\"position:absolute;left:-9999px\">Remove<\/span><\/th>\n      <\/tr><\/thead>\n      <tbody id=\"rows\"><\/tbody>\n      <tfoot><tr><td cla <script>
{
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LKEY='login-last',SKEY='portal-session',DKEY='portal-declarations',EKEY='portal-estimates';
const PMS=['Eyad','Johnpaul','Wael'];
const SECS=[['lab','Labor'],['ind','Indirect Labor'],['veh','Vehicles & Equipment'],['mat','Materials'],['sub','Subcontractor'],['oth','Other Fees']];
const FREE=['mat','sub'],HOURLY=['lab','ind'];

let ME=null; // {r:'pm'|'est', name}

// ---------- shared declaration store (this browser) ----------
// ---------- shared database (giffin-db via /api/data) ----------
// The page keeps a copy of all declarations and estimates in memory. load()/loadE() read that copy;
// store()/storeE() update it and send only the changed documents to the server.
const DB={d:[],e:[],ready:false,pending:0,failed:false};
const clone=v=>JSON.parse(JSON.stringify(v));
const load=()=>clone(DB.d);
const loadE=()=>clone(DB.e);
function pushChanged(kind,next,prev){
  const before=new Map(prev.map(x=>[x.id,JSON.stringify(x)]));
  const changed=next.filter(x=>x&&x.id&&before.get(x.id)!==JSON.stringify(x));
  if(!changed.length)return;
  DB.pending++;setSync('saving');
  api('POST',{kind,docs:changed}).then(()=>{DB.failed=false}).catch(err=>{DB.failed=true;toast('Not saved to the server: '+err.message+' Your change is kept on this page; try again.')})
    .finally(()=>{DB.pending--;setSync(DB.failed?'error':DB.pending?'saving':'ok')});
}
const store=a=>{const prev=DB.d;DB.d=clone(a);pushChanged('declaration',DB.d,prev);return true};
const storeE=a=>{const prev=DB.e;DB.e=clone(a);pushChanged('estimate',DB.e,prev);return true};
async function api(method,body){
  if(!ME||!ME.token)throw new Error('Please sign in again.');
  let r;
  try{r=await fetch('/api/data',{method,headers:{'Authorization':'Bearer '+ME.token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'})}
  catch(e){throw new Error('No connection to the server.')}
  const j=await r.json().catch(()=>({}));
  if(r.status===401){window.__logout();$('err').textContent='Your session has ended. Please sign in again.';throw new Error('Please sign in again.')}
  if(!r.ok||!j.ok)throw new Error(j.error||('Server error '+r.status+'.'));
  return j;
}
// fetch everything; moves any data saved in this browser by the earlier offline version up to the server once
async function refresh(){
  const j=await api('GET');
  if(DB.pending)return false;               // don't overwrite changes that are still being saved
  const same=DB.ready&&JSON.stringify(j.declarations)===JSON.stringify(DB.d)&&JSON.stringify(j.estimates)===JSON.stringify(DB.e);
  DB.d=j.declarations;DB.e=j.estimates;DB.ready=true;
  try{
    const ld=JSON.parse(localStorage.getItem(DKEY)||'[]'),le=JSON.parse(localStorage.getItem(EKEY)||'[]');
    const nd=ld.filter(x=>x&&x.id&&!DB.d.some(y=>y.id===x.id)),ne=le.filter(x=>x&&x.id&&!DB.e.some(y=>y.id===x.id));
    const canD=ME.r==='est'?nd:ME.r==='pm'?nd.filter(x=>x.pm===ME.name):[];
    const canE=ME.r==='est'||ME.r==='apr'?ne:[];
    if(canD.length){await api('POST',{kind:'declaration',docs:canD});DB.d=DB.d.concat(canD)}
    if(canE.length){await api('POST',{kind:'estimate',docs:canE});DB.e=DB.e.concat(canE)}
    if(canD.length||canE.length)toast('Moved '+(canD.length+canE.length)+' record(s) saved on this computer into the shared database.');
    const leftD=ld.filter(x=>!DB.d.some(y=>y.id===x.id)),leftE=le.filter(x=>!DB.e.some(y=>y.id===x.id));
    leftD.length?localStorage.setItem(DKEY,JSON.stringify(leftD)):localStorage.removeItem(DKEY);
    leftE.length?localStorage.setItem(EKEY,JSON.stringify(leftE)):localStorage.removeItem(EKEY);
  }catch(e){}
  return !same;
}
function setSync(st){const el=$('sync');if(!el)return;el.className='sync '+st;el.textContent={ok:ME&&(ME.r==='sal'||ME.r==='adm')?'● Up to date':'● Saved to shared database',saving:'● Saving…',error:'● Not saved, check connection',load:'● Loading…'}[st]||''}
async function enter(){
  $('dBody').innerHTML='<div class="empty"><b>Loading…</b>Getting the latest declarations and estimates.</div>';show('dash');setSync('load');
  try{await refresh();setSync('ok')}catch(e){if(!ME)return;setSync('error');toast('Could not load data: '+e.message)}
  if(ME)renderDash();
}
// keep dashboards up to date while they are open
setInterval(async()=>{
  if(!ME||$('dash').hidden||!$('viewer').hidden||!$('adlg').hidden||DB.pending)return;
  try{if(await refresh())(ME.r==='sal'?salesSearch():ME.r==='adm'?admRender():renderDash());setSync('ok')}catch(e){setSync('error')}
},20000);
const money=(v,c)=>(c||'AED')+' '+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const last=e=>e.revisions[e.revisions.length-1];
let CUR=null; // estimate open in the form: {id, decId, decNo}
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const filled=v=>String(v??'').trim()!==''&&num(v)>0;
const plural=(n,w)=>n+' '+w+(n==1?'':'s');
function basis(r){
  if(FREE.includes(r.s))return r.u||'';
  if(!r.d||!filled(r.h)||!filled(r.q)||!filled(r.y))return '';
  const h=num(r.h);return num(r.q)+' × '+plural(num(r.y),'Day')+(HOURLY.includes(r.s)||h!==1?' @ '+plural(h,'hr')+'/day':'');
}
const itemCount=d=>d.jobs.reduce((a,J)=>a+J.rows.filter(r=>String(r.d||'').trim()).length,0);
const when=iso=>new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const whenS=iso=>new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

// next running number for a PM on today's date
function nextSeq(pm){
  const d=new Date(),p=n=>String(n).padStart(2,'0'),base='PMD-'+pm.toUpperCase()+'-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  const used=load().filter(x=>x.decNo.startsWith(base+'-')).map(x=>parseInt(x.decNo.slice(base.length+1))||0);
  return String((used.length?Math.max(...used):0)+1).padStart(2,'0');
}

function show(view){
  $('login').hidden=view!=='login';$('dash').hidden=view!=='dash';
  const inApp=view==='app';$('app').hidden=!inApp;document.body.classList.toggle('in',inApp);
  if(!inApp){$('app').removeAttribute('srcdoc');$('app').src='about:blank'}

function inject(html,vars){
  const s=Object.entries(vars).map(([k,v])=>'window.'+k+'='+JSON.stringify(v).replace(/</g,'\\u003c')+';').join('');

// declaration revisions (R0 = first submission)
const decRevs=d=>d.revs&&d.revs.length?d.revs:[{rev:0,at:d.submittedAt,by:d.pm,jobs:d.jobs,decNo:d.decNo}];

const APPR={pending:['Pending approval','ip'],approved:['Approved','done'],returned:['Returned for revision','ret']};
const apprFor=(e,rev)=>(e.approvals||[]).filter(x=>x.rev===rev).slice(-1)[0]||null;
const apprState=e=>{const a=apprFor(e,last(e).rev);return a?(a.action==='approved'?'approved':'returned'):'pending'};
const apprChip=e=>{const k=apprState(e),[t,c]=APPR[k];return `<span class="chip ${c}">Rev ${last(e).rev} · ${t}</span>`};
const estFor=d=>loadE().find(x=>x.decId===d.id);
const apprLine=a=>a?`<div class="ap ${a.action}"><b>${a.action==='approved'?'Approved':'Returned for revision'}</b> by <strong>${esc(a.by)}</strong> · ${esc(whenS(a.at))}${a.comment?`<q>${esc(a.comment)}</q>`:''}</div>`:'';
function chip(st,d){if(d&&(st==='created'||st==='done')){const E=estFor(d);if(E){const k=apprState(E),[t2,c2]=APPR[k];return `<span class="chip ${c2}">Estimate ${k==='pending'?'pending approval':k==='approved'?'approved':'returned'} · Rev ${last(E).rev}</span>`}}const [t,c]=STATUS[st]||STATUS.sub;const rc=st==='drev'?' · R'+decRevNo(d):d&&d.revCount?' · Rev '+d.revCount:'';return `<span class="chip ${c}">${t}${rc}</span>`}
const estLine=d=>(d.status==='created'||d.status==='done')&&d.estCreatedAt?'<br>Estimation created '+esc(when(d.estCreatedAt))+(d.lastRevAt?'<br>Last revised '+esc(when(d.lastRevAt)):''):'';
const estBtn=(d,cls)=>isEstimated(d)
  ?`<button class="${cls}" type="button" disabled title="Already estimated. It will be enabled when ${esc(d.pm)} revises this declaration.">Estimate</button>`
  :`<button class="${cls}" type="button" data-est="${esc(d.id)}">Estimate</button>`;
function rowHTML(d,est){
  const jobs=d.jobs.map(J=>J.name||'Untitled job').join(', ');

    <div class="when">Submitted ${esc(when(d.submittedAt))}${decRevNo(d)?'<br>Revised (R'+decRevNo(d)+') '+esc(when(decRevs(d).slice(-1)[0].at)):''}${estLine(d)}</div>

    <div class="acts"><button class="btn sm" type="button" data-view="${esc(d.id)}">View</button>${est?estBtn(d,'btn sm p'):`<button class="btn sm p" type="button" data-drev="${esc(d.id)}">Revise</button>`}</div></div>`;
}
// estimated = an estimate exists and was saved against the declaration's latest revision
const isEstimated=d=>(d.status==='created'||d.status==='done');
function stats(list,ests,mode){
  const c=k=>list.filter(d=>k.includes(d.status)).length;
  const decRevTotal=list.reduce((a,d)=>a+decRevNo(d),0),decRevised=list.filter(d=>decRevNo(d)>0).length;
  const estRevTotal=ests.reduce((a,e)=>a+e.revisions.length-1,0),estRevised=ests.filter(e=>e.revisions.length>1).length;
  const tile=(cls,n,t,sub)=>`<div class="stat ${cls}"><div class="n">${n}</div><div class="t">${t}</div>${sub?`<div class="u">${sub}</div>`:''}</div>`;
  return `<div class="stats">${tile('',list.length,'Total declarations','')}
  ${tile('s1',c(['sub']),'New, waiting for estimate','')}
  ${tile('s4',c(['drev']),'Revised, waiting for estimate','')}
  ${tile('s2',c(['ip']),'In estimation','')}
  ${tile('s3',c(['created','done']),'Estimation created','')}
  ${tile('s4',decRevTotal,'Declaration revisions',decRevised?plural(decRevised,'declaration')+' revised':'None yet')}
  ${tile('s3',estRevTotal,'Estimate revisions',estRevised?plural(estRevised,'estimate')+' revised':'None yet')}
  ${tile('s2',ests.filter(e=>apprState(e)==='pending').length,'Estimates pending approval','')}
  ${tile('s3',ests.filter(e=>apprState(e)==='approved').length,'Estimates approved','')}
  ${tile('s5',ests.filter(e=>apprState(e)==='returned').length,'Returned for revision','')}</div>`;
}
function aprStats(ests){
  const n=k=>ests.filter(e=>apprState(e)===k).length,acts=ests.flatMap(e=>e.approvals||[]);
  const tile=(cls,v,t,sub)=>`<div class="stat ${cls}"><div class="n">${v}</div><div class="t">${t}</div>${sub?`<div class="u">${sub}</div>`:''}</div>`;
  const revs=ests.reduce((a,e)=>a+e.revisions.length-1,0);

  ${tile('s4',revs,'Estimate revisions',revs?plural(ests.filter(e=>e.revisions.length>1).length,'estimate')+' revised':'None yet')}
  ${tile('s3',acts.filter(a=>a.action==='approved').length,'Approvals given','')}${tile('s5',acts.filter(a=>a.action==='returned').length,'Returns made','')}</div>`;
}

function admData(){
  const f=ADM.from,t=ADM.to,inR=iso=>(!f||iso>=f)&&(!t||iso<=t);
  const decs=load().filter(d=>inR(d.date||isoLocal(d.submittedAt))).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.decNo.localeCompare(b.decNo));
  const ests=loadE().filter(e=>inR(isoLocal(e.createdAt))).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  const decRows=decs.map((d,i)=>{const DR=decRevs(d),E=estFor(d);return {no:i+1,ref:decLabel(d),date:niceDate(d.date||isoLocal(d.submittedAt)),pm:d.pm,jobs:d.jobs.map(J=>J.name||'Untitled').join('; '),items:itemCount(d),rev:decRevNo(d)?'R'+decRevNo(d):'R0',lastRev:decRevNo(d)?whenS(DR.slice(-1)[0].at):'',status:decStatusText(d),est:E?E.estNo:''}});
  const estRows=ests.map((e,i)=>{const L=last(e),a=apprFor(e,L.rev),st=apprState(e);return {no:i+1,ref:e.estNo,dec:e.decNo||'Blank estimate',pm:e.pm,created:whenS(e.createdAt),by:e.revisions[0].by,rev:'Rev '+L.rev,lastRev:L.rev?whenS(L.at)+' by '+L.by:'',total:+(+L.total).toFixed(2),cur:L.cur||'AED',status:APPR[st][0],decided:a?(a.action==='approved'?'Approved':'Returned')+' by '+a.by+' · '+whenS(a.at)+(a.comment?' · “'+a.comment+'”':''):''}});
  return {decRows,estRows};
}
const DEC_COLS=[['no','#'],['ref','Declaration No.'],['date','Declaration date'],['pm','Project Manager'],['jobs','Job / Scope'],['items','Items'],['rev','Revision'],['lastRev','Last revised'],['status','Status'],['est','Estimate No.']];
const EST_COLS=[['no','#'],['ref','Estimation No.'],['dec','Declaration'],['pm','Project Manager'],['created','Created'],['by','Created by'],['rev','Latest rev'],['lastRev','Last revised'],['total','Grand total'],['status','Approval status'],['decided','Decision']];
function admTable(cols,rows){
  return `<div class="atw"><table class="at"><thead><tr>${cols.map(([k,t])=>`<th class="${k==='total'||k==='items'||k==='no'?'n':''}">${t}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(r=>`<tr>${cols.map(([k])=>`<td class="${k==='total'||k==='items'||k==='no'?'n':''}${k==='status'?' st':''}">${k==='total'?esc(r.cur+' '+Number(r.total).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})):esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function admRender(){
  const out=$('admOut');if(!out)return;
  ADM.from=$('admFrom').value;ADM.to=$('admTo').value;
  if(ADM.from&&ADM.to&&ADM.from>ADM.to){out.innerHTML='<div class="tray"><div class="empty"><b>“From” is after “To”</b>Pick a valid date range.</div></div>';return}
  const {decRows,estRows}=admData(),rangeTxt=niceDate(ADM.from)+' to '+niceDate(ADM.to);
  const cnt=(rows,k)=>rows.filter(r=>r.status===k).length;
  const totalApproved=estRows.filter(r=>r.status==='Approved').reduce((a,r)=>a+r.total,0);
  out.innerHTML=`<section class="rep"><div class="bar"><h2>Project Manager Declarations <span class="cnt">${decRows.length}</span></h2>
      <button class="btn" type="button" data-rep="dec:pdf">Print PDF</button><button class="btn p" type="button" data-rep="dec:xls">Export Excel</button></div>
    <p class="rsub">Declaration date ${esc(rangeTxt)} · ${cnt(decRows,'Submitted')} submitted · ${cnt(decRows,'In estimation')} in estimation · ${cnt(decRows,'Revised, waiting for estimate')} revised · ${decRows.filter(r=>r.status.startsWith('Estimate')).length} estimated</p>
    ${decRows.length?admTable(DEC_COLS,decRows):'<div class="tray"><div class="empty"><b>No declarations in this date range</b></div></div>'}</section>
    <section class="rep"><div class="bar"><h2>Estimates <span class="cnt">${estRows.length}</span></h2>
      <button class="btn" type="button" data-rep="est:pdf">Print PDF</button><button class="btn p" type="button" data-rep="est:xls">Export Excel</button></div>
    <p class="rsub">Created ${esc(rangeTxt)} · ${cnt(estRows,'Pending approval')} pending approval · ${cnt(estRows,'Approved')} approved · ${cnt(estRows,'Returned for revision')} returned · approved value AED ${totalApproved.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</p>
    ${estRows.length?admTable(EST_COLS,estRows):'<div class="tray"><div class="empty"><b>No estimates in this date range</b></div></div>'}</section>`;
}
function admReport(kind,fmt){
  const {decRows,estRows}=admData(),rows=kind==='dec'?decRows:estRows,cols=kind==='dec'?DEC_COLS:EST_COLS;
  const title=kind==='dec'?'Project Manager Declarations':'Estimates',rangeTxt=niceDate(ADM.from)+' to '+niceDate(ADM.to);
  const base=(kind==='dec'?'Declarations':'Estimates')+' '+ADM.from+' to '+ADM.to;
  if(!rows.length){toast('There is nothing in this date range to '+(fmt==='pdf'?'print':'export')+'.');return}
  if(fmt==='xls'){
    const H=v=>({v,s:'h'}),T=v=>({v,s:'t'}),B=v=>({v,s:'b'});
    const L=[[ '',T(title.toUpperCase())],[],['',B(kind==='dec'?'Declaration date:':'Created:'),rangeTxt],['',B('Records:'),rows.length],['',B('Generated:'),whenS(new Date().toISOString())+' by '+ME.name],[],cols.map(([,t])=>H(t))];
    rows.forEach(r=>L.push(cols.map(([k])=>k==='total'?{v:r.total,s:'n'}:(k==='no'||k==='items')?r[k]:String(r[k]??''))));
    if(kind==='est'){const tot=rows.reduce((a,r)=>a+r.total,0);L.push([],['',B('Total of all estimates'),'','','','','','',{v:+tot.toFixed(2),s:'bn'}],['',B('Total approved'),'','','','','','',{v:+rows.filter(r=>r.status==='Approved').reduce((a,r)=>a+r.total,0).toFixed(2),s:'bn'}])}
    const widths=kind==='dec'?[5,30,16,16,36,8,10,22,28,28]:[5,28,30,16,22,14,10,30,16,22,50];
    try{const url=URL.createObjectURL(xlsxBlob(L,widths)),a=document.createElement('a');a.href=url;a.download=base+'.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Excel file downloaded.')}
    catch(e){toast('The download was blocked by the browser.')}
    return;
  }
  const logo=(document.querySelector('.logo'))?.outerHTML||'';
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(base)}</title><style>
    @page{size:A4 portrait;margin:0}*{box-sizing:border-box}html,body{margin:0;width:210mm}
    body{padding:12mm 10mm 14mm;font:9.5px/1.35 Figtree,Arial,sans-serif;color:#0c1f33;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .hd{display:flex;align-items:center;gap:10px;border-bottom:3px solid #046cb4;padding-bottom:8px;margin-bottom:10px}.hd .logo{height:44px;width:auto}h1{margin:0;font-size:18px}
    .meta{display:flex;gap:22px;margin-bottom:10px;font-size:9px;color:#546579;font-weight:600}.meta b{display:block;font-size:11px;color:#0c1f33}
    table{width:100%;border-collapse:collapse;table-layout:auto}th{font-size:8.5px;text-align:left;background:#046cb4;color:#fff;padding:5px 4px}td{padding:4px;border-bottom:1px solid #d9e3ee;vertical-align:top;overflow-wrap:anywhere}
    .n{text-align:right;white-space:nowrap}tr{break-inside:avoid}thead{display:table-header-group}tbody tr:nth-child(even) td{background:#f3f7fb}.ft{margin-top:8px;font-size:9px;color:#546579}</style></head><body>
    <div class="hd">${logo}<h1>${esc(title)}</h1></div>
    <div class="meta"><div>${kind==='dec'?'Declaration date':'Created'}<b>${esc(rangeTxt)}</b></div><div>Records<b>${rows.length}</b></div><div>Generated<b>${esc(whenS(new Date().toISOString()))} by ${esc(ME.name)}</b></div></div>
    <table><thead><tr>${cols.map(([k,t])=>`<th class="${k==='total'||k==='items'||k==='no'?'n':''}">${t}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${cols.map(([k])=>`<td class="${k==='total'||k==='items'||k==='no'?'n':''}">${k==='total'?esc(r.cur+' '+Number(r.total).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})):esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>
    ${kind==='est'?`<p class="ft">Total of all estimates: AED ${rows.reduce((a,r)=>a+r.total,0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} · Approved: AED ${rows.filter(r=>r.status==='Approved').reduce((a,r)=>a+r.total,0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</p>`:''}</body></html>`;
  printDoc(html,base);
}
function printDoc(html,name){
  document.getElementById('printFrame')?.remove();
  const f=document.createElement('iframe');f.id='printFrame';f.title='Print';f.setAttribute('aria-hidden','true');
  f.style.cssText='position:fixed;left:-10000px;top:0;width:900px;height:1200px;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(f);
  f.addEventListener('load',()=>{const pt=document.title;document.title=name;setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(x){toast('Printing was blocked by the browser.')}setTimeout(()=>{document.title=pt},1000)},300);try{f.contentWindow.addEventListener('afterprint',()=>setTimeout(()=>f.remove(),300))}catch(x){}});
  f.srcdoc=html;
}

function salesPrint(id){
  const e=loadE().find(x=>x.id===id);if(!e||e.status!=='approved')return;
  const logo=(document.querySelector('#login .logo')||document.querySelector('.logo'))?.outerHTML||'';

  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(e.estNo)} Summary</title><style>
    @page{size:A4 portrait;margin:0}*{box-sizing:border-box}html,body{margin:0;width:210mm}
    body{padding:14mm 14mm 16mm;font:12px/1.45 Figtree,Arial,sans-serif;color:#0c1f33;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid #046cb4;padding-bottom:10px;margin-bottom:14px}.hd .logo{height:52px;width:auto}
    h1{margin:0;font-size:22px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.meta div{font-size:10px;color:#546579;font-weight:600}.meta b{display:block;font-size:12.5px;color:#0c1f33}
    .sumt{width:100%;border-collapse:collapse}.sumt th{font-size:10.5px;color:#546579;text-align:left;border-bottom:2px solid #0c1f33;padding:6px 8px}.sumt td{padding:6px 8px;border-bottom:1px solid #d9e3ee}
    .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.j td{background:#046cb4;color:#fff;font-weight:700}.sec{padding-left:22px!important}
    .st td{font-weight:700;background:#e7f1fa}.gt td{font-weight:800;font-size:14px;border-top:2px solid #0c1f33;border-bottom:0;padding-top:10px}
    .sfoot{font-size:10px;color:#546579;margin-top:10px}tr{break-inside:avoid}</style></head><body>
    <div class="hd">${logo}<h1>Estimate Summary</h1></div>
    <div class="meta"><div>Estimation No.<b>${esc(e.estNo)}</b></div><div>Project Manager<b>${esc(e.pm)}</b></div><div>Approved<b>${esc(d)} · Rev ${e.rev}</b></div><div>Approved by<b>${esc(e.approvedBy)}</b></div></div>
    ${summaryHTML(e,true)}</body></html>`;
  document.getElementById('printFrame')?.remove();
  const f=document.createElement('iframe');f.id='printFrame';f.title='Print';f.setAttribute('aria-hidden','true');
  f.style.cssText='position:fixed;left:-10000px;top:0;width:900px;height:1200px;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(f);
  f.addEventListener('load',()=>{const pt=document.title;document.title=e.estNo+' Summary';setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(x){toast('Printing was blocked by the browser.')}setTimeout(()=>{document.title=pt},1000)},300);try{f.contentWindow.addEventListener('afterprint',()=>setTimeout(()=>f.remove(),300))}catch(x){}});
  f.srcdoc=html;
}

  show('dash');
}

// combined History: declaration revisions (by the PM) + estimate revisions (by Estimators), in time order
function historyBox(d){
  const ev=[],DR=decRevs(d);
  DR.forEach((r,i)=>ev.push({at:r.at,cls:'dec',t:r.rev?`Declaration revised · ${esc(d.decNo)}-R${r.rev}`:`Declaration submitted · ${esc(d.decNo)}`,by:r.by||d.pm,
    extra:i?changesHTML(diffData({jobs:DR[i-1].jobs},{jobs:r.jobs})):''}));
  const E=loadE().find(x=>x.decId===d.id);
  const er=E?E.revisions:(d.revTimes||(d.estCreatedAt?[{rev:0,at:d.estCreatedAt}]:[]));
  if(E)(E.approvals||[]).forEach(a=>ev.push({at:a.at,cls:a.action==='approved'?'apv':'ret',t:(a.action==='approved'?'Estimate approved':'Estimate returned for revision')+' · Rev '+a.rev+' · '+esc(E.estNo),by:a.by,extra:a.comment?`<div class="hq">“${esc(a.comment)}”</div>`:''}));
  er.forEach(r=>ev.push({at:r.at,cls:'est',t:(r.rev?'Estimate revised · Rev '+r.rev:'Estimation created · Rev 0')+' · '+esc(E?E.estNo:d.estNo||'')+(r.decRev!=null?' <small>(based on '+(r.decRev?'R'+r.decRev:'R0')+')</small>':''),by:r.by,extra:''}));
  ev.sort((a,b)=>a.at.localeCompare(b.at));
  return `<div class="track hist"><b>History</b><ol>${ev.map(x=>`<li class="${x.cls}"><span>${x.t}${x.by?` <em>by <strong>${esc(x.by)}</strong></em>`:''}</span><time>${esc(whenS(x.at))}</time>${x.extra?`<div class="hx">${x.extra}</div>`:''}</li>`).join('')}</ol></div>`;
}

const RATE_NAMES=[['oh','Overhead'],['mk','Markup'],['cont','Contingency'],['nego','Negotiation']];
const SEC_NAME=Object.fromEntries(SECS);
const FIELD_NAMES={h:'Hrs',q:'Qty',y:'Days',u:'UOM',p:'Unit price'};
const sv=v=>{const t=String(v??'').trim();return t===''?'blank':t};
function itemText(r){
  if(FREE.includes(r.s))return `${r.d} (${sv(r.q)} ${r.u||''}${String(r.p??'').trim()?' @ '+r.p:''})`.replace(/\s+\)/,')');
  return r.d+(basis(r)?' ('+basis(r)+')':'');
}
function diffData(A,B){
  const out=[];
  if(sv(A.cur)!==sv(B.cur))out.push({k:'chg',t:`Currency: ${sv(A.cur)} → ${sv(B.cur)}`});
  if(sv(A.pm)!==sv(B.pm))out.push({k:'chg',t:`Project Manager: ${sv(A.pm)} → ${sv(B.pm)}`});
  RATE_NAMES.forEach(([k,n])=>{if(sv(A[k])!==sv(B[k]))out.push({k:'chg',t:`${n}: ${sv(A[k])}${sv(A[k])==='blank'?'':'%'} → ${sv(B[k])}${sv(B[k])==='blank'?'':'%'}`})});
  const n=Math.max(A.jobs.length,B.jobs.length);
  for(let j=0;j<n;j++){
    const a=A.jobs[j],b=B.jobs[j],lbl='Job '+(j+1)+(b&&b.name?' ('+b.name+')':a&&a.name?' ('+a.name+')':'');
    if(!a){out.push({k:'add',t:`Added ${lbl}`});b.rows.filter(r=>String(r.d||'').trim()).forEach(r=>out.push({k:'add',t:`${lbl} · ${SEC_NAME[r.s]||r.s}: added ${itemText(r)}`}));continue}
    if(!b){out.push({k:'del',t:`Removed ${lbl} and its ${a.rows.filter(r=>String(r.d||'').trim()).length} item(s)`});continue}
    if(sv(a.name)!==sv(b.name))out.push({k:'chg',t:`Job ${j+1} name: ${sv(a.name)} → ${sv(b.name)}`});
    if(sv(a.consDays)!==sv(b.consDays))out.push({k:'chg',t:`${lbl} · Consumables days: ${sv(a.consDays)} → ${sv(b.consDays)}`});
    // match items by section + description (+ occurrence)
    const keyed=rows=>{const seen={},m=new Map();rows.filter(r=>String(r.d||'').trim()).forEach(r=>{const k=r.s+'|'+String(r.d).trim().toLowerCase();seen[k]=(seen[k]||0)+1;m.set(k+'|'+seen[k],r)});return m};
    const ma=keyed(a.rows),mb=keyed(b.rows);
    mb.forEach((r,k)=>{
      const o=ma.get(k),where=`${lbl} · ${SEC_NAME[r.s]||r.s}`;
      if(!o){out.push({k:'add',t:`${where}: added ${itemText(r)}`});return}
      const f=Object.keys(FIELD_NAMES).filter(x=>(x in r||x in o)&&sv(o[x])!==sv(r[x])).map(x=>`${FIELD_NAMES[x]} ${sv(o[x])} → ${sv(r[x])}`);
      if(f.length)out.push({k:'chg',t:`${where} · ${r.d}: ${f.join(', ')}`});
    });
    ma.forEach((r,k)=>{if(!mb.has(k))out.push({k:'del',t:`${lbl} · ${SEC_NAME[r.s]||r.s}: removed ${itemText(r)}`})});
  }
  return out;
}

// Export one saved revision as a PDF, in the same layout as the Estimation Form's Export as PDF
function exportRevPDF(id,rev){
  const e=loadE().find(x=>x.id===id),r=e&&e.revisions.find(x=>x.rev===+rev);if(!r)return;
  document.getElementById('printFrame')?.remove();
  const f=document.createElement('iframe');f.id='printFrame';f.title='Print';f.setAttribute('aria-hidden','true');
  f.style.cssText='position:fixed;left:-10000px;top:0;width:1100px;height:800px;border:0;opacity:0;pointer-events:none';
  const d=new Date(r.at),dateNice=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const vars={__LOGIN_QS__:'?as=est&name='+encodeURIComponent(r.by||''),__PRINTONLY__:true,__PRESET__:r.data,__ESTNO__:e.estNo,__PRINTREV__:r.rev,__DATE__:dateNice,
    __REVLINE__:'Rev '+r.rev+(r.rev?' · revised by ':' · created by ')+(r.by||'')+' · saved '+whenS(r.at)};
  if(e.decId)vars.__FROMDEC__={id:e.decId,decNo:e.decNo,pm:e.pm};
  f.srcdoc=inject(FORM_EST,vars);
  document.body.appendChild(f);
  f.addEventListener('load',()=>{try{f.contentWindow.addEventListener('afterprint',()=>setTimeout(()=>f.remove(),300))}catch(x){}});
  toast('Preparing '+e.estNo+' Rev '+r.rev+' — choose “Save as PDF” in the print window.');
}
function askApproval(id,action){
  const e=loadE().find(x=>x.id===id);if(!e||!ME||ME.r!=='apr')return;
  const L=last(e);if(apprState(e)!=='pending'){toast('Rev '+L.rev+' of '+e.estNo+' has already been '+(apprState(e)==='approved'?'approved':'returned')+'.');return}
  const ok=action==='approved';
  $('aTitle').textContent=ok?'Approve this estimate?':'Return this estimate for revision?';
  $('aBody').innerHTML=`<dl class="adl"><dt>Estimation No.</dt><dd><b>${esc(e.estNo)}</b></dd><dt>Revision</dt><dd>Rev ${L.rev}</dd><dt>Project Manager</dt><dd>${esc(e.pm)}</dd>
    <dt>${L.rev?'Revised by':'Created by'}</dt><dd>${esc(L.by)} · ${esc(whenS(L.at))}</dd><dt>Grand total</dt><dd><b>${esc(money(L.total,L.cur))}</b></dd></dl>`;
  $('aLbl').textContent=ok?'Comment (optional)':'Reason for returning (required)';
  $('aCmt').value='';$('aErr').textContent='';
  $('aYes').textContent=ok?'Approve':'Return for revision';$('aYes').className='btn '+(ok?'g':'rt');
  $('adlg').hidden=false;$('aCmt').focus();
  $('aYes').onclick=()=>{
    const c=$('aCmt').value.trim().slice(0,500);
    if(!ok&&!c){$('aErr').textContent='Please write why it is being returned.';$('aCmt').focus();return}
    const all=loadE(),x=all.find(q=>q.id===id);if(!x)return;
    (x.approvals=x.approvals||[]).push({rev:last(x).rev,action,by:ME.name,at:new Date().toISOString(),comment:c});
    storeE(all);$('adlg').hidden=true;$('viewer').hidden=true;renderDash();
    notify(ok?'Estimate approved':'Returned for revision',`<b>${esc(x.estNo)}</b> Rev ${last(x).rev} was ${ok?'approved':'returned to the Estimator'} by <b>${esc(ME.name)}</b> on ${esc(whenS(new Date().toISOString()))}.${c?`<br><i>“${esc(c)}”</i>`:''}`,ok?'ok':'ret');
  };
}

// ---------- Estimate (prefill Estimation form from the declaration) ----------
function reviseDec(id){
  const d=load().find(x=>x.id===id);if(!d||!ME||ME.r!=='pm'||d.pm!==ME.name)return;
  openForm('pm',{__REVISE__:{id:d.id,decNo:d.decNo,rev:decRevNo(d)+1,pm:d.pm,jobs:d.jobs}});
}
function presetFromDec(d){
  return {pm:d.pm,cur:'AED',oh:'',mk:'',cont:'',nego:'',jobs:d.jobs.map(J=>({name:J.name,consDays:'',
    rows:J.rows.filter(r=>String(r.d||'').trim()).map(r=>FREE.includes(r.s)?{s:r.s,d:r.d,u:r.u||'',p:'',q:r.q??''}:{s:r.s,d:r.d,h:r.h??'',q:r.q??'',y:r.y??''})}))};
}
// bring a revised declaration into the existing estimate: new quantities from the PM, prices / rates kept
function mergeDecIntoEst(est,d){
  const out=JSON.parse(JSON.stringify(est));
  out.jobs=d.jobs.map((J,j)=>{
    const old=est.jobs.find(o=>String(o.name||'').trim().toLowerCase()===String(J.name||'').trim().toLowerCase())||est.jobs[j]||{rows:[],consDays:''};
    return {name:J.name,consDays:old.consDays??'',rows:J.rows.filter(r=>String(r.d||'').trim()).map(r=>{
      if(!FREE.includes(r.s))return {s:r.s,d:r.d,h:r.h??'',q:r.q??'',y:r.y??''};
      const o=old.rows.find(x=>x.s===r.s&&String(x.d||'').trim().toLowerCase()===String(r.d).trim().toLowerCase());
      return {s:r.s,d:r.d,u:r.u||'',p:o?o.p:'',q:r.q??''};
    })};
  });
  return out;
}
function openEstimate(e){
  const L=last(e);CUR={id:e.id,decId:e.decId,decNo:e.decNo,decRev:L.decRev||0};
  const vars={__EST__:{id:e.id,rev:L.rev,savedNice:when(L.at)},__PRESET__:L.data,__ESTNO__:e.estNo};
  {const a=apprFor(e,L.rev);if(a&&a.action==='returned')vars.__DECUPD__=`<b>Rev ${L.rev} was returned for revision</b> by ${esc(a.by)} on ${esc(whenS(a.at))}.${a.comment?`<br>Reason: “${esc(a.comment)}”`:''}<br>Make the changes and press <b>Estimate</b> to send Rev ${L.rev+1} for approval.`;else if(a&&a.action==='approved')vars.__DECUPD__=`<b>Rev ${L.rev} is approved</b> by ${esc(a.by)} on ${esc(whenS(a.at))}. Saving changes creates Rev ${L.rev+1}, which will need approval again.`}
  if(e.decId){const d=load().find(x=>x.id===e.decId);vars.__FROMDEC__={id:e.decId,decNo:d?decLabel(d):e.decNo,pm:e.pm};if(d&&decRevNo(d)>(L.decRev||0)){estimate(d.id);return}}
  openForm('est',vars);
}
function estimate(id){
  const all=load(),d=all.find(x=>x.id===id);if(!d)return;
  const ex=loadE().find(e=>e.decId===id);
  if(ex){

      const DR=decRevs(d),from=DR.find(r=>r.rev===based)||DR[0];
      CUR={id:ex.id,decId:ex.decId,decNo:ex.decNo,decRev:cur};
      const banner=`<b>Declaration revised to ${esc(decLabel(d))}</b> by ${esc(d.pm)} on ${esc(whenS(DR.slice(-1)[0].at))}. The items below were updated from the revised declaration (your rates and unit prices were kept). Review them, then press <b>Estimate</b> to create Rev ${L.rev+1}.${changesHTML(diffData({jobs:from.jobs},{jobs:d.jobs}))}`;
      openForm('est',{__EST__:{id:ex.id,key:ex.id+':R'+cur,rev:L.rev,savedNice:when(L.at)},__PRESET__:mergeDecIntoEst(L.data,d),__ESTNO__:ex.estNo,__FROMDEC__:{id:d.id,decNo:decLabel(d),pm:d.pm},__DECUPD__:banner});
      return;

    openEstimate(ex);return}
  if(d.status==='sub'){d.status='ip';store(all)}
  CUR={id:'e_'+d.id,decId:d.id,decNo:d.decNo,decRev:decRevNo(d)};
  openForm('est',{__EST__:{id:CUR.id},__PRESET__:presetFromDec(d),__FROMDEC__:{id:d.id,decNo:decLabel(d),pm:d.pm},__ESTNO__:d.decNo.replace(/^PMD-/,'EST-')});
}
$('dBody').addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){viewDec(v.dataset.view);return}
  const dr=e.target.closest('[data-drev]');if(dr){reviseDec(dr.dataset.drev);return}
  const s=e.target.closest('[data-est]');if(s){estimate(s.dataset.est);return}
  const h=e.target.closest('[data-hist]');if(h){showHistory(h.dataset.hist);return}
  const rp=e.target.closest('[data-rep]');if(rp){const [k,f]=rp.dataset.rep.split(':');admReport(k,f);return}
  const qr=e.target.closest('[data-qr]');if(qr){const t=new Date(),p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
    const y=t.getFullYear(),m=t.getMonth(),r={this:[new Date(y,m,1),new Date(y,m+1,0)],last:[new Date(y,m-1,1),new Date(y,m,0)],year:[new Date(y,0,1),new Date(y,11,31)]}[qr.dataset.qr];
    $('admFrom').value=iso(r[0]);$('admTo').value=iso(r[1]);admRender();return}
  const sv=e.target.closest('[data-sview]');if(sv){salesView(sv.dataset.sview);return}
  const sp=e.target.closest('[data-sprint]');if(sp){salesPrint(sp.dataset.sprint);return}
  const ap=e.target.closest('[data-appr]');if(ap){const [i,a]=ap.dataset.appr.split(':');askApproval(i,a);return}
  const sn=e.target.closest('[data-snap]');if(sn){const [i,rv]=sn.dataset.snap.split(':');snapshot(i,rv);return}
  const r=e.target.closest('[data-rev]');if(r){const x=loadE().find(e=>e.id===r.dataset.rev);if(x)openEstimate(x)}
});

// ---------- hooks called by the forms ----------
window.__previewDeclaration=p=>{
  if(!ME||ME.r!=='pm')return null;
  const d=load().find(x=>x.id===p.reviseId);if(!d)return null;
  if(JSON.stringify(d.jobs)===JSON.stringify(p.jobs))return {same:true,current:decLabel(d)};
  const ch=diffData({jobs:d.jobs},{jobs:p.jobs}),E=loadE().find(e=>e.decId===d.id);
  return {current:decLabel(d),prevJobs:plural(d.jobs.length,'job'),prevItems:plural(itemCount(d),'item'),count:ch.length,changesHTML:changesHTML(ch),hasEst:!!E,estNo:E?E.estNo:''};
};
window.__submitDeclaration=p=>{
  if(!ME||ME.r!=='pm')return false;
  const all=load();
  if(p.reviseId){
    const d=all.find(x=>x.id===p.reviseId);if(!d||d.pm!==ME.name)return false;
    if(JSON.stringify(d.jobs)===JSON.stringify(p.jobs))return 'same';
    const now=new Date().toISOString(),revs=decRevs(d).slice(),rev=decRevNo(d)+1;
    revs.push({rev,at:now,by:ME.name,jobs:p.jobs,decNo:d.decNo+'-R'+rev});
    d.revs=revs;d.decRev=rev;d.jobs=p.jobs;
    const hasEst=loadE().some(e=>e.decId===d.id);d.status=hasEst?'drev':(d.status==='ip'?'ip':'sub');
    if(!store(all))return false;
    renderDash();toast('Revised declaration '+decLabel(d)+' submitted to the Estimator.');
    return true;
  }
  let decNo=p.decNo;if(all.some(x=>x.decNo===decNo))decNo=decNo.replace(/-\d+$/,'')+'-'+nextSeq(ME.name);
  all.push({id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),decNo,pm:p.pm,date:p.date,dateNice:p.dateNice,jobs:p.jobs,submittedAt:new Date().toISOString(),status:'sub'});
  if(!store(all))return false;
  renderDash();toast('Declaration '+decNo+' submitted to the Estimator.');
  return true;
};
window.__previewEstimate=p=>{
  if(!ME||ME.r!=='est'||!CUR)return null;
  const e=loadE().find(x=>x.id===CUR.id);
  if(!e)return {isNew:true,nextRev:0,estNo:p.estNo};
  const L=last(e);
  if(JSON.stringify(L.data)===JSON.stringify(p.data)&&(L.decRev||0)===(CUR.decRev||0))return {same:true,rev:L.rev,estNo:e.estNo};
  return {isNew:false,nextRev:L.rev+1,estNo:e.estNo,prevTotal:L.total,changesHTML:changesHTML(diffData(L.data,p.data))};
};
window.__saveEstimate=p=>{
  if(!ME||ME.r!=='est'||!CUR)return null;
  const E=loadE(),now=new Date().toISOString();let e=E.find(x=>x.id===CUR.id);
  const snap={at:now,by:ME.name,data:p.data,rows:p.rows,cost:p.cost,total:p.total,cur:p.cur,decRev:CUR.decRev??0};
  if(!e){
    let no=p.estNo;if(E.some(x=>x.estNo===no)){let k=2;while(E.some(x=>x.estNo===no+'-'+String(k).padStart(2,'0')))k++;no=no+'-'+String(k).padStart(2,'0')}
    e={id:CUR.id,estNo:no,decId:CUR.decId,decNo:CUR.decNo,pm:p.pm,createdAt:now,createdBy:ME.name,revisions:[{rev:0,...snap}]};E.push(e);
  }else{
    const L=last(e);if(JSON.stringify(L.data)===JSON.stringify(p.data)&&(L.decRev||0)===(CUR.decRev||0))return {same:true,rev:L.rev,estNo:e.estNo};
    e.revisions.push({rev:L.rev+1,...snap});
  }
  if(!storeE(E))return null;
  if(e.decId){const all=load(),d=all.find(x=>x.id===e.decId);if(d){d.status='created';d.estNo=e.estNo;d.estCreatedAt=e.createdAt;d.revCount=last(e).rev;d.lastRevAt=last(e).rev?now:null;d.revTimes=e.revisions.map(r=>({rev:r.rev,at:r.at,by:r.by}));store(all)}}
  return {rev:last(e).rev,estNo:e.estNo,savedNice:when(now),savedNiceS:whenS(now)};
};
window.__dashboard=()=>{saveSession();show('dash');enter()};
window.__logout=()=>{ME=null;DB.d=[];DB.e=[];DB.ready=false;try{sessionStorage.removeItem(SKEY)}catch(e){}show('login')};
$('dOut').onclick=()=>window.__logout();
function saveSession(){try{sessionStorage.setItem(SKEY,JSON.stringify(ME))}catch(e){}}

// ---------- login ----------
const ROLE_HINT={pm:'Create declarations and submit them to the Estimator.',est:'Review received declarations and estimate them.',apr:'Approve estimates or return them for revision.',sal:'Look up an estimate by its reference and print approved estimate summaries.',adm:'Print and export reports of declarations and estimates for a date range.'};
const role=()=>$('roleSel').value;
function showWho(){const r=role();$('pmBox').hidden=r!=='pm';$('estBox').hidden=r!=='est';$('aprBox').hidden=r!=='apr';$('salBox').hidden=r!=='sal';$('admBox').hidden=r!=='adm';$('pwBox').hidden=!r;$('roleHint').textContent=ROLE_HINT[r]||'';$('err').textContent=''}
const nameEl=r=>r==='pm'?$('pmSel'):r==='apr'?$('aprName'):r==='sal'?$('salName'):r==='adm'?$('admName'):$('estName');
$('roleSel').addEventListener('change',()=>{showWho();if(role())nameEl(role()).focus()});
$('pwEye').onclick=()=>{const v=$('pw').type==='password';$('pw').type=v?'text':'password';$('pwEye').textContent=v?'Hide':'Show';$('pwEye').setAttribute('aria-pressed',String(v));$('pwEye').setAttribute('aria-label',v?'Hide password':'Show password')};
['pmSel','estName','aprName','salName','admName','pw'].forEach(id=>$(id).addEventListener('input',()=>$('err').textContent=''));
try{const L=JSON.parse(localStorage.getItem(LKEY)||'{}');if(L.role)$('roleSel').value=L.role;if(L.pm)$('pmSel').value=L.pm;if(L.est)$('estName').value=L.est;if(L.apr)$('aprName').value=L.apr;if(L.sal)$('salName').value=L.sal;if(L.adm)$('admName').value=L.adm}catch(e){}
showWho();
$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const r=role();
  if(!r){$('err').textContent='Choose your role in “Login as”.';$('roleSel').focus();return}
  const name=r==='pm'?$('pmSel').value:nameEl(r).value.trim().slice(0,60);
  if(!name){$('err').textContent=r==='pm'?'Select your username.':'Enter your username.';nameEl(r).focus();return}
  const pw=$('pw').value;
  if(!pw){$('err').textContent='Enter your password.';$('pw').focus();return}
  const go=$('goBtn');go.disabled=true;go.textContent='Signing in…';
  let res=null;
  try{const rq=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:r,username:name,password:pw})});res=await rq.json().catch(()=>null);if(res&&!rq.ok&&!res.error)res.error='Sign-in failed.'}
  catch(x){res={ok:false,error:location.protocol==='file:'?'Sign-in needs the online version of the portal. Open it from its web address.':'Could not reach the sign-in service. Check your connection and try again.'}}
  go.disabled=false;go.textContent='Login';
  if(!res||!res.ok){$('err').textContent=(res&&res.error)||'Sign-in failed.';$('pw').select();return}
  $('pw').value='';$('pw').type='password';$('pwEye').textContent='Show';
  try{localStorage.setItem(LKEY,JSON.stringify({role:r,pm:$('pmSel').value,est:$('estName').value.trim(),apr:$('aprName').value.trim(),sal:$('salName').value.trim(),adm:$('admName').value.trim()}))}catch(e){}
  ME={r:res.role,name:res.name,token:res.token,exp:res.exp};saveSession();enter();
});
try{const ss=JSON.parse(sessionStorage.getItem(SKEY)||'null');if(ss&&ss.token&&ss.exp>Date.now()&&(ss.r==='pm'&&PMS.includes(ss.name)||(ss.r==='est'||ss.r==='apr'||ss.r==='sal'||ss.r==='adm')&&ss.name)){ME=ss;enter()}else sessionStorage.removeItem(SKEY)}catch(e){}
}
</script>
